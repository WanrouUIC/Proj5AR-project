<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>My AR Project</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      renderer="antialias: true; alpha: true;"
      arjs="sourceType: webcam; debugUIEnabled: false; cameraParametersUrl: ./lib/camera_para.dat;">

      <!-- MARKER 02 -->
      <a-marker type="pattern" url="./assets/pattern-ar-02.patt">
        <a-entity rotation="-90 0 0">
          <a-image src="./assets/after-scan-2.png" width="1" height="0.7" position="0 0.5 0"></a-image>
          <a-text value="We didn't know those days would become memories." align="center" color="#FFFFFF" width="2" position="0 -0.2 0.01"></a-text>
        </a-entity>
      </a-marker>

      <!-- MARKER 03 -->
      <a-marker type="pattern" url="./assets/pattern-ar-03.patt">
        <a-entity rotation="-90 0 0">
          <a-image src="./assets/after-scan-3.png" width="1" height="0.7" position="0 0.5 0"></a-image>
          <a-text value="Back then, even ordinary days felt endless." align="center" color="#FFFFFF" width="2" position="0 -0.2 0.01"></a-text>
        </a-entity>
      </a-marker>

      <!-- MARKER 04 -->
      <a-marker type="pattern" url="./pattern-ar-04.patt">
        <a-entity rotation="-90 0 0">
          <a-image src="./assets/after-scan-4.png" width="1" height="0.7" position="0 0.5 0"></a-image>
          <a-text value="So many moments, quietly becoming years." align="center" color="#FFFFFF" width="2" position="0 -0.2 0.01"></a-text>
        </a-entity>
      </a-marker>

      <!-- MARKER 05 -->
      <a-marker type="pattern" url="./assets/pattern-ar-05.patt">
        <a-entity rotation="-90 0 0">
          <a-image src="./assets/after-scan-5.png" width="1" height="0.7" position="0 0.5 0"></a-image>
          <a-text value="Somehow, time never waited for us." align="center" color="#FFFFFF" width="2" position="0 -0.2 0.01"></a-text>
        </a-entity>
      </a-marker>

      <!-- MARKER 06 -->
      <a-marker type="pattern" url="./assets/pattern-ar-06.patt">
        <a-entity rotation="-90 0 0">
          <a-image src="./assets/after-scan-6.png" width="1" height="0.7" position="0 0.5 0"></a-image>
          <a-text value="By the time I noticed, it was already gone." align="center" color="#FFFFFF" width="2" position="0 -0.2 0.01"></a-text>
        </a-entity>
      </a-marker>

      <!-- MARKER 07 -->
      <a-marker type="pattern" url="./assets/pattern-ar-07.patt">
        <a-entity rotation="-90 0 0">
          <a-image src="./assets/after-scan-7.png" width="1" height="0.7" position="0 0.5 0"></a-image>
          <a-text value="I wish I could go back again." align="center" color="#FFFFFF" width="2" position="0 -0.2 0.01"></a-text>
        </a-entity>
      </a-marker>

      <!-- MARKER 08 -->
      <a-marker type="pattern" url="./assets/pattern-ar-08.patt">
        <a-entity rotation="-90 0 0">
          <a-image src="./assets/after-scan-8.png" width="1" height="0.7" position="0 0.5 0"></a-image>
          <a-text value="We look alike, yet belong to different times." align="center" color="#FFFFFF" width="2" position="0 -0.2 0.01"></a-text>
        </a-entity>
      </a-marker>

      <!-- MARKER 09 -->
      <a-marker type="pattern" url="./assets/pattern-ar-09.patt">
        <a-entity rotation="-90 0 0">
          <a-image src="./assets/after-scan-9.png" width="1" height="0.7" position="0 0.5 0"></a-image>
          <a-text value="The thought of those days came back." align="center" color="#FFFFFF" width="2" position="0 -0.2 0.01"></a-text>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
