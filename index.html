<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>My AR Project</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>

<body>
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; precision: medium;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro">
  <a-box position="0 0.5 0" color="red"></a-box>
</a-marker>
    
    <a-marker type="pattern" url="./pattern-ar-02.patt">
      <a-entity
        position="0 0.5 0"
        animation__hop="property: position; from: 0 0.5 0; to: 0 1.2 0; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine"
        animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">

        <a-entity rotation="-90 0 0">
          <a-text value="DANIEL LEE" align="center" color="#00FF88" scale="2 2 2" side="double"></a-text>
          <a-text value="DANIEL LEE" align="center" color="#003311" position="0 0 -0.05" scale="2 2 2" side="double"></a-text>
        </a-entity>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
