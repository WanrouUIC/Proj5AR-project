
<!doctype html>
<html>
  <head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no">

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="antialias: true; alpha: true"
      arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- Your custom marker -->
      <a-marker
        type="pattern"
        url="./pattern-ar-marker-02.patt">

        <a-entity
          position="0 0.5 0"
          animation__hop="
            property: position;
            from: 0 0.5 0;
            to: 0 1.2 0;
            dir: alternate;
            loop: true;
            dur: 1200;
            easing: easeInOutSine"
          animation__spin="
            property: rotation;
            to: 0 360 0;
            loop: true;
            dur: 3000;
            easing: linear">

          <a-entity rotation="-90 0 0">

            <a-text
              value="DANIEL LEE"
              align="center"
              color="#00FF88"
              scale="2 2 2"
              side="double">
            </a-text>

            <a-text
              value="DANIEL LEE"
              align="center"
              color="#003311"
              position="0 0 -0.05"
              scale="2 2 2"
              side="double">
            </a-text>

          </a-entity>
        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>

    </a-scene>

  </body>
</html>
