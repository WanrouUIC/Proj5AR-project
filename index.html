<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Proj5 AR-Project</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; precision: medium;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <!-- Marker 02 -->
    <a-marker
      type="pattern"
      url="./pattern-ceshi.patt">

      <a-entity 
        position="0 0.5 0"
        rotation="-90 0 0">
        
          <a-image
          src="./pattern-ceshi.png"
          width="3"
          height="3.3"
          position="0 0 0.01">
          </a-image>
        
          <a-text
          value="We didn't know those days would become memories."
          align="center"
          color="#FFFFFF"
          width="2"
          position="0 -0.2 0.01">
          </a-text>
        
      </a-entity>

    </a-marker>

    <!-- MARKER 03 -->
    <a-marker
      type="pattern"
      url="./pattern-ar-marker-03.patt">

      <a-entity rotation="-90 0 0">

        <a-image
          src="./after-scan-03.png"
          width="1"
          height="0.7"
          position="0 0.5 0">
        </a-image>

        <a-text
          value="Back then, even ordinary days felt endless."
          align="center"
          color="#FFFFFF"
          width="2"
          position="0 -0.2 0.01">
        </a-text>

      </a-entity>

    </a-marker>

    <!-- MARKER 04 -->
    <a-marker
      type="pattern"
      url="./pattern-ar-marker-04.patt">

      <a-entity rotation="-90 0 0">

        <a-image
          src="./after-scan-04.png"
          width="1"
          height="0.7"
          position="0 0.5 0">
        </a-image>

        <a-text
          value="So many moments, quietly becoming years."
          align="center"
          color="#FFFFFF"
          width="2"
          position="0 -0.2 0.01">
        </a-text>

      </a-entity>

    </a-marker>

    <!-- MARKER 05 -->
    <a-marker
      type="pattern"
      url="./pattern-ar-marker-05.patt">

      <a-entity rotation="-90 0 0">

        <a-image
          src="./after-scan-05.png"
          width="1"
          height="0.7"
          position="0 0.5 0">
        </a-image>

        <a-text
          value="Somehow, time never waited for us."
          align="center"
          color="#FFFFFF"
          width="2"
          position="0 -0.2 0.01">
        </a-text>

      </a-entity>

    </a-marker>

    <!-- MARKER 06 -->
    <a-marker
      type="pattern"
      url="./pattern-ar-marker-06.patt">

      <a-entity rotation="-90 0 0">

        <a-image
          src="./after-scan-06.png"
          width="1"
          height="0.7"
          position="0 0.5 0">
        </a-image>

        <a-text
          value="By the time I noticed, it was already gone."
          align="center"
          color="#FFFFFF"
          width="2"
          position="0 -0.2 0.01">
        </a-text>

      </a-entity>

    </a-marker>

    <!-- MARKER 07 -->
    <a-marker
      type="pattern"
      url="./pattern-ar-marker-07.patt">

      <a-entity rotation="-90 0 0">

        <a-image
          src="./after-scan-07.png"
          width="1"
          height="0.7"
          position="0 0.5 0">
        </a-image>

        <a-text
          value="I wish I could go back again."
          align="center"
          color="#FFFFFF"
          width="2"
          position="0 -0.2 0.01">
        </a-text>

      </a-entity>

    </a-marker>

    <!-- MARKER 08 -->
    <a-marker
      type="pattern"
      url="./pattern-ar-marker-08.patt">

      <a-entity rotation="-90 0 0">

        <a-image
          src="./after-scan-08.png"
          width="1"
          height="0.7"
          position="0 0.5 0">
        </a-image>

        <a-text
          value="We look alike, yet belong to different times."
          align="center"
          color="#FFFFFF"
          width="2"
          position="0 -0.2 0.01">
        </a-text>

      </a-entity>

    </a-marker>

    <!-- MARKER 09 -->
    <a-marker
      type="pattern"
      url="./pattern-ar-marker-09.patt">

      <a-entity rotation="-90 0 0">

        <a-image
          src="./after-scan-09.png"
          width="1"
          height="0.7"
          position="0 0.5 0">
        </a-image>

        <a-text
          value="The thought of those days came back."
          align="center"
          color="#FFFFFF"
          width="2"
          position="0 -0.2 0.01">
        </a-text>

      </a-entity>

    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
