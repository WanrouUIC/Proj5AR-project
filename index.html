
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <title>My AR Project</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <div id="video-check"
     style="position:fixed; top:55px; left:10px; z-index:9999;
     background:black; color:white; padding:10px;">
  Checking video...
</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; precision: medium;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const status = document.getElementById("status");
    const scene = document.querySelector("a-scene");

    scene.addEventListener("loaded", function () {
      status.textContent = "A-Frame scene loaded. Waiting for camera...";
    });

    scene.addEventListener("camera-init", function () {
      status.textContent = "Camera initialized!";
    });

    scene.addEventListener("camera-error", function (event) {
      status.textContent = "Camera error: " +
        JSON.stringify(event.detail);
    });

    scene.addEventListener("arjs-video-loaded", function () {
      status.textContent = "AR video loaded!";
    });

    setInterval(function () {
  const videos = document.querySelectorAll("video");
  const check = document.getElementById("video-check");

  check.textContent = "Video elements: " + videos.length;

  if (videos.length > 0) {
    check.textContent +=
      " | Ready state: " + videos[0].readyState +
      " | Size: " + videos[0].videoWidth +
      "x" + videos[0].videoHeight;
  }
}, 1000);
  </script>

</body>
</html>
