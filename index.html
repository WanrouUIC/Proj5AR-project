
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <meta name="apple-mobile-web-app-capable"
        content="yes">

  <title>My AR Project</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

</head>

<body style="margin:0; overflow:hidden;">

  <!-- Status message -->
  <div id="status"
       style="
       position:fixed;
       top:10px;
       left:10px;
       z-index:9999;
       background:black;
       color:white;
       padding:10px;
       font-size:14px;">
    Waiting for AR scene...
  </div>

  <!-- Video diagnostic -->
  <div id="video-check"
       style="
       position:fixed;
       top:55px;
       left:10px;
       z-index:9999;
       background:black;
       color:white;
       padding:10px;
       font-size:14px;">
    Checking video...
  </div>

  <!-- AR Scene -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; precision: medium;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <!-- Camera -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>

    const status = document.getElementById("status");
    const scene = document.querySelector("a-scene");

    // A-Frame scene loaded
    scene.addEventListener("loaded", function () {
      status.textContent =
        "A-Frame scene loaded. Waiting for camera...";
    });

    // Camera initialized
    scene.addEventListener("camera-init", function () {
      status.textContent = "Camera initialized!";
    });

    // Camera error
    scene.addEventListener("camera-error", function (event) {
      status.textContent =
        "Camera error: " + JSON.stringify(event.detail);
    });

    // AR video loaded
    scene.addEventListener("arjs-video-loaded", function () {
      status.textContent = "AR video loaded!";
    });

    // Check video status
    setInterval(function () {

      const videos = document.querySelectorAll("video");
      const check = document.getElementById("video-check");

      check.textContent =
        "Video elements: " + videos.length;

      if (videos.length > 0) {

        check.textContent +=
          " | Ready state: " + videos[0].readyState +
          " | Size: " +
          videos[0].videoWidth + "x" +
          videos[0].videoHeight;

      }

    }, 1000);

  </script>

</body>
</html>
